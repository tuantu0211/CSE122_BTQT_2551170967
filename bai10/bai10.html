<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form liên hệ</title>
    <link rel="stylesheet" href="bai10.css">
</head>

<body>
    <main class="contact-card">
        <header class="form-header">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </header>
        <form class="contact-form" action="#" method="get">
            <div class="form-grid">
                <div class="form-field">
                    <label for="full-name">Họ và tên</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Nguyễn Văn An" autocomplete="name"
                        required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="an.nv@tlu.edu.vn" autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="0987 654 321" autocomplete="tel" required>
                </div>

                <div class="form-field">
                    <label for="subject">Chủ đề</label>
                    <select id="subject" name="subject" required>
                        <option value="" selected disabled>Chọn chủ đề</option>
                        <option value="course">Hỏi về khóa học</option>
                        <option value="assignment">Hỏi về bài tập</option>
                        <option value="feedback">Góp ý</option>
                        <option value="other">Khác</option>
                    </select>
                </div>

                <div class="form-field message-field">
                    <label for="message">Nội dung</label>
                    <textarea id="message" name="message" rows="4" placeholder="Nhập nội dung liên hệ của bạn…"
                        required></textarea>
                </div>
            </div>

            <div class="consent-field">
                <input type="checkbox" id="consent" name="consent" value="yes" required>
                <label for="consent">Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <div class="form-actions">
                <button class="submit-button" type="submit">Gửi liên hệ</button>
                <button class="reset-button" type="reset">Nhập lại</button>
            </div>
        </form>
    </main>
</body>

</html>
